<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="g1" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#9EE8D8" />
      <stop offset="60%" stop-color="#8B6CFF" />
      <stop offset="100%" stop-color="#2b1144" />
    </radialGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6CFF"/>
      <stop offset="50%" stop-color="#C9B8FF"/>
      <stop offset="100%" stop-color="#3FD6C0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- outer orbit ring -->
  <g transform="translate(150,150)">
    <ellipse rx="120" ry="30" fill="none" stroke="url(#g2)" stroke-width="6" opacity="0.85" transform="rotate(-20)" />
    <ellipse rx="120" ry="30" fill="none" stroke="url(#g2)" stroke-width="3" opacity="0.45" transform="rotate(-20)" />

    <!-- planet -->
    <circle r="60" fill="url(#g1)" filter="url(#glow)" />

    <!-- circuit lines -->
    <g stroke="#B8A8FF" stroke-width="2" stroke-linecap="round" transform="rotate(10)">
      <path d="M-10 -20 L 18 -36" opacity="0.95" />
      <circle cx="22" cy="-38" r="3" fill="#fff" />
      <path d="M-24 10 L -42 30" stroke="#3FD6C0" />
      <circle cx="-44" cy="32" r="2.6" fill="#3FD6C0" />
    </g>

    <!-- small stars -->
    <g fill="#C9B8FF" opacity="0.9">
      <circle cx="-78" cy="-48" r="2" />
      <circle cx="84" cy="-10" r="1.8" />
      <circle cx="60" cy="64" r="2.2" />
    </g>

    <!-- center R monogram -->
    <g transform="translate(-18,8) scale(1.2)">
      <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fff">R</text>
    </g>

  </g>
</svg>