<svg width="300" height="220" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#2b1b3a"/>
      <stop offset="40%" stop-color="#0b0810"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6c6ff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#caa6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#caa6ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(150,110)">
    <!-- ring behind -->
    <ellipse rx="140" ry="36" fill="none" stroke="url(#ringGrad)" stroke-width="10" opacity="0.9" transform="rotate(-12)" filter="url(#softGlow)"/>
    <!-- planet -->
    <g>
      <circle r="60" fill="url(#planetGrad)" />
      <!-- subtle reflections -->
      <ellipse cx="-12" cy="-18" rx="34" ry="18" fill="rgba(255,255,255,0.03)"/>
      <ellipse cx="-8" cy="-12" rx="18" ry="8" fill="rgba(255,255,255,0.06)"/>
      <ellipse cx="20" cy="6" rx="10" ry="6" fill="rgba(255,255,255,0.02)"/>
      <!-- glossy highlight -->
      <path d="M -26 -36 C -10 -56, 26 -52, 40 -28" fill="rgba(255,255,255,0.06)"/>
      <!-- inner subtle bottom glow -->
      <ellipse cx="0" cy="22" rx="46" ry="12" fill="rgba(200,120,140,0.04)"/>
    </g>

    <!-- ring front (over planet) -->
    <ellipse rx="140" ry="36" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="1" transform="rotate(-12)"/>

    <!-- small orbiting dots -->
    <circle cx="100" cy="-20" r="3.5" fill="#b8a8ff"/>
    <circle cx="-110" cy="-10" r="2.2" fill="#9ee8d8"/>
    <circle cx="80" cy="32" r="2.6" fill="#b8a8ff"/>
  </g>
</svg>